#######################################
# PACKAGE                             #
#######################################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reposcan"
version = "0.2.0"
description = """
Orchestrates security scanners (secrets, SBOM, SCA, SAST, IaC, workflow)
over a repository, locally or in an ephemeral container.
"""
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
reposcan = "reposcan.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reposcan"]

#######################################
# TOX/TEST CONFIG                     #
#######################################

[tool.tox]
# tox>=4.46 is necessary for the integration-py310/py312/py314 factor-resolution.
requires = ["tox>=4.46", "tox-uv>=1"]
env_list = [
  "unit-py310", "unit-py312", "unit-py314",
  "lint", "type"
]

[tool.tox.env_run_base.set_env]
PYTHONUNBUFFERED = "1"
XDG_CACHE_HOME = "{env_tmp_dir}/xdg-cache"
XDG_CONFIG_HOME = "{env_tmp_dir}/xdg-config"

[tool.tox.env.lint]
description = "Lint and format-check with ruff"
allowlist_externals = ["bash"]
skip_install = true
recreate = true
deps = ["-r{tox_root}/requirements/lint.txt"]
commands = [
    ["bash", "tests/lint/ascii-check.sh", "py"],
    ["bash", "tests/lint/license-check.sh"],
    ["ruff", "check", "{tox_root}/src", "{tox_root}/tests"],
    ["ruff", "format", "--check", "{tox_root}/src", "{tox_root}/tests"],
]

[tool.tox.env.fmt]
description = "Run ruff's auto-formatter"
allowlist_externals = ["sh"]
skip_install = true
recreate = true
deps = ["-r{tox_root}/requirements/lint.txt"]
commands = [
    [
      "ruff", "check", "--fix",
      "{tox_root}/src", "{tox_root}/tests"
    ],
    [
      "ruff", "format",
      "{tox_root}/src", "{tox_root}/tests"
    ],
]

[tool.tox.env.type]
description = "Type-check with basedpyright"
recreate = true
# Include the test lock so the test modules (which import pytest) type-check too.
deps = [
    "-r{tox_root}/requirements/typecheck.txt",
    "-r{tox_root}/requirements/test.txt",
]
commands = [
    [
      "basedpyright",
      "--pythonpath", "{envpython}",
      "{tox_root}/src", "{tox_root}/tests"
    ]
]

# Version matrix (py310/py312/py314): install the package and run the unit tests.
[tool.tox.env_base.unit]
factors = [["py310", "py312", "py314"]]
description = "Run unit tests"
deps = ["-r{tox_root}/requirements/test.txt"]
recreate = true  # Recreate tox env on each run
commands = [["pytest", { replace = "posargs", default = [], extend = true }]]

# run with `tox run -f integration` or `tox run -e integration-py310`
[tool.tox.env_base.integration]
factors = [["py310", "py312", "py314"]]
description = "Integration tests against real docker/lxd"
deps = ["-r{tox_root}/requirements/test.txt"]
commands = [[
  "pytest", "{tox_root}/tests/integration", "-s", "--log-cli-level=INFO",
  { replace = "posargs", default = [], extend = true }
]]
pass_env = ["HOME", "DOCKER_HOST", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS"]

[tool.tox.env.scans]
description = "Test scans against known-bad content fixtures"
deps = ["-r{tox_root}/requirements/test.txt"]
commands = [[
  "pytest", "{tox_root}/tests/scans", "-s", "--log-cli-level=INFO",
  { replace = "posargs", default = [], extend = true }
]]
pass_env = ["HOME", "DOCKER_HOST", "XDG_RUNTIME_DIR"]

#######################################
# TOOL CONFIG                         #
#######################################

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# Enforce google-style formatting on the docstrings we write, but do not require a
# docstring on every public symbol (D100-D107): small, self-evident methods and
# Protocol stubs stay undocumented rather than carrying filler.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through descriptive names, not docstrings.
"tests/**" = ["D"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# importlib mode allows test files to share the same basename
addopts = "-v --import-mode=importlib"
