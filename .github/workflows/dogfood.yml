name: dogfood

# runs the repo-scan action defined in the current branch

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**
      - action.yml

permissions:
  contents: read
  security-events: write # upload SARIF to the code-scanning pane
  pull-requests: write # post the results summary as a PR comment

concurrency:
  group: repo-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      matrix:
        runner-image: [ubuntu-latest, self-hosted-linux-amd64-noble-small]
    runs-on: ${{ matrix.runner-image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # full history so the secrets scan (history mode) has commits
          persist-credentials: false
      - uses: ./
        with:
          fail-on: warning
          pr-comment: true
